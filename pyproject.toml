[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-starter"
version = "0.1.0"
description = "Interactive CLI to bootstrap a Docker Compose homelab stack"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "questionary>=2.0",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.scripts]
homelab-starter = "homelab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
